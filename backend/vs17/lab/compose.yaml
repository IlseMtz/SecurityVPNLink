name: securelink-vs17-lab
services:
  laboratorio:
    image: ${SL17_LAB_IMAGE:?Indica el digest de la imagen Nginx autorizada}
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      laboratorio:
        ipv4_address: 172.30.77.10
networks:
  laboratorio:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-sl-lab
    ipam:
      config:
        - subnet: 172.30.77.0/24
